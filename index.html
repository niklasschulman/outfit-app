
<!DOCTYPE html>
<html lang="sv">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Niklas garderob</title>

<link rel="apple-touch-icon" href="icons/icon-180.png">
  
<link rel="stylesheet" href="style.css">

<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Garderob">
  
</head>

<body>

<header>

<h1>Niklas garderob</h1>

<div class="filters">

<select id="occasionFilter">
<option value="">Alla tillfällen</option>
<option value="work">Jobb</option>
<option value="weekend">Helg</option>
<option value="dejt">Dejt</option>
<option value="toppdejt">Toppdejt</option>
<option value="socialt">Socialt</option>
</select>

<select id="seasonFilter">
<option value="">Alla säsonger</option>
<option value="sommar">Sommar</option>
<option value="vinter">Vinter</option>
<option value="vår">Vår</option>
<option value="höst">Höst</option>
</select>

<input
id="searchInput"
placeholder="Sök plagg">

<button id="todayBtn">
🎲
</button>

</div>
<div id="resultCount"></div>

<div class="quickFilters">
<button data-term="kavaj">Kavaj</button>
<button data-term="jeans">Jeans</button>
<button data-term="t-shirt">T-shirt</button>
<button data-term="overshirt">Overshirt</button>
<button data-term="boots">Boots</button>
</div>

<div id="resultCount"></div>
</header>

<main>

<section id="outfitsView">

<div id="outfitsGrid" class="grid"></div>

</section>

<section id="clothesView" class="hidden">

<h2>Plagg</h2>

<div id="clothesList"></div>

</section>

<section id="detailView" class="hidden">

<button id="backBtn">
← Tillbaka
</button>

<div id="detailContent"></div>

</section>

</main>

<nav class="bottomNav">

<button data-view="outfitsView">
Outfits
</button>

<button data-view="clothesView">
Plagg
</button>

</nav>

<script src="app.js"></script>

</body>
</html>
