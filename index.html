<!DOCTYPE html>
<html lang="sv">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Niklas garderob</title>

<link rel="stylesheet" href="style.css">

<link rel="manifest" href="manifest.json">

</head>

<body>

<header>

<h1>Niklas garderob</h1>

<div class="filters">

<select id="occasionFilter">
<option value="">Alla tillfällen</option>
<option value="work">Jobb</option>
<option value="weekend">Helg</option>
</select>

<select id="seasonFilter">
<option value="">Alla säsonger</option>
<option value="summer">Sommar</option>
<option value="winter">Vinter</option>
<option value="spring">Vår</option>
<option value="autumn">Höst</option>
</select>

<input
id="searchInput"
placeholder="Sök plagg">

<button id="randomBtn">
🎲
</button>

</div>
<div id="resultCount"></div>
</header>

<main>

<section id="outfitsView">

<div id="outfitsGrid" class="grid"></div>

</section>

<section id="clothesView" class="hidden">

<h2>Plagg</h2>

<div id="clothesList"></div>

</section>

<section id="detailView" class="hidden">

<button id="backBtn">
← Tillbaka
</button>

<div id="detailContent"></div>

</section>

</main>

<nav class="bottomNav">

<button data-view="outfitsView">
Outfits
</button>

<button data-view="clothesView">
Plagg
</button>

</nav>

<script src="app.js"></script>

</body>
</html>
